[package]
name = "quantykube"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "A Kubernetes data store with time travel"
repository = "https://github.com/QuantyRoot/QuantyKube"
publish = false

# Only QuantyRoot crates may appear here. See ADR-003 in docs/DECISIONS.md.
[workspace]
members = ["crates/quantykube-sys"]

[dependencies]
quantykube-sys = { path = "crates/quantykube-sys" }
quantycore = { git = "https://github.com/QuantyRoot/QuantyCore", rev = "c32c195d8dbaaab2342ec94895d8fe1753e77b9f" }
quantydb-core = "0.4.0"
