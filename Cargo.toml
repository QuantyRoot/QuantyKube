[package]
name = "quantykube"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "A Kubernetes data store with time travel, and a node runtime without shims"
repository = "https://github.com/QuantyRoot/QuantyKube"
publish = false

# Only QuantyRoot crates may appear here. See ADR-003 in docs/DECISIONS.md.
[workspace]
members = ["crates/quantykube-sys", "crates/kubectl-quanty"]

[dependencies]
quantykube-sys = { path = "crates/quantykube-sys" }
quantycore = { git = "https://github.com/QuantyRoot/QuantyCore", rev = "f89c48d4fc1d4fbf1f113d4f42e673b69d8b8976" }
quantydb-core = "0.4.0"
