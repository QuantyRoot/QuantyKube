name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand, so a rerun never needs a commit nobody wanted.
  workflow_dispatch:

# The toolchain is pinned, not tracked: with -D warnings every new stable
# lint would otherwise break an unrelated commit. Raising it is its own
# commit. The MSRV job is the promise, not the ceiling.
env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  e2e:
    name: real etcdctl, kube-apiserver and k3s, and a move from etcd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: fetch etcdctl and k3s at pinned versions
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLO https://github.com/etcd-io/etcd/releases/download/v3.6.15/etcd-v3.6.15-linux-amd64.tar.gz
          curl -fsSLo k3s https://github.com/k3s-io/k3s/releases/download/v1.37.1%2Bk3s1/k3s
          curl -fsSLO https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kube-apiserver
          curl -fsSLO https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
          sha256sum -c - <<'SUMS'
          b51d86e6bff2168de5ba8cd631c0fe6c785c7a1b32b083079f5677d6b7e2772c  etcd-v3.6.15-linux-amd64.tar.gz
          92b94582eb7b34a8cf532e6006842b9ed215a6783cf56a3dd6271fd35243b2c0  k3s
          de9b1b43c10143f448408b3aaf15f44fd5248b97a56301417a1fe2f1fc47a691  kube-apiserver
          65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8  kubectl
          SUMS
          tar xzf etcd-v3.6.15-linux-amd64.tar.gz --strip-components=1 \
            etcd-v3.6.15-linux-amd64/etcdctl etcd-v3.6.15-linux-amd64/etcd
          chmod +x k3s etcdctl kube-apiserver kubectl
      - run: cargo build --release --workspace
      - name: run
        run: |
          b=$RUNNER_TEMP/bin
          sudo env ETCDCTL=$b/etcdctl KUBE_APISERVER=$b/kube-apiserver \
            KUBECTL=$b/kubectl K3S=$b/k3s scripts/e2e.sh
      - name: a cluster moved from a real etcd
        run: |
          b=$RUNNER_TEMP/bin
          env ETCD=$b/etcd KUBE_APISERVER=$b/kube-apiserver KUBECTL=$b/kubectl scripts/migrate.sh

  raft-cluster:
    name: three store nodes on Raft, etcdctl and kube-apiserver, the leader killed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: fetch etcdctl and kube-apiserver at pinned versions
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLO https://github.com/etcd-io/etcd/releases/download/v3.6.15/etcd-v3.6.15-linux-amd64.tar.gz
          curl -fsSLO https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kube-apiserver
          curl -fsSLO https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
          sha256sum -c - <<'SUMS'
          b51d86e6bff2168de5ba8cd631c0fe6c785c7a1b32b083079f5677d6b7e2772c  etcd-v3.6.15-linux-amd64.tar.gz
          de9b1b43c10143f448408b3aaf15f44fd5248b97a56301417a1fe2f1fc47a691  kube-apiserver
          65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8  kubectl
          SUMS
          tar xzf etcd-v3.6.15-linux-amd64.tar.gz --strip-components=1 etcd-v3.6.15-linux-amd64/etcdctl
          chmod +x etcdctl kube-apiserver kubectl
      - run: cargo build --release
      - name: run
        run: |
          b=$RUNNER_TEMP/bin
          env ETCDCTL=$b/etcdctl KUBE_APISERVER=$b/kube-apiserver KUBECTL=$b/kubectl scripts/raft.sh

  crash:
    name: kill -9 the server under writes (200 kills)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: cargo test --release --test crash -- --nocapture
        env:
          QUANTY_CRASH_ITERS: "200"

  sandbox:
    name: sandbox, runtime and CRI, and start time against runc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: fetch runc at a pinned version
        run: |
          curl -fsSLo "$RUNNER_TEMP/runc" https://github.com/opencontainers/runc/releases/download/v1.3.2/runc.amd64
          echo "e7a8e30bd6d248f494aae9163521ff4eb112a30602ac56ada0871e3531269c2d  $RUNNER_TEMP/runc" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/runc"
      - run: cargo build --release
      - run: sudo env RUNC="$RUNNER_TEMP/runc" scripts/sandbox.sh
      - name: the runtime core, which needs root
        run: |
          bin=$(cargo test --release --test runtime --no-run 2>&1 | grep -o 'target/release/deps/runtime-[0-9a-f]*' | head -1)
          sudo "$bin" --nocapture
      - name: fetch crictl and a busybox image at pinned digests
        run: |
          curl -fsSLo crictl.tgz https://github.com/kubernetes-sigs/cri-tools/releases/download/v1.34.0/crictl-v1.34.0-linux-amd64.tar.gz
          echo "a8ff2a3edb37a98daf3aba7c3b284fe0aa5bff24166d896ab9ef64c8913c9f51  crictl.tgz" | sha256sum -c -
          tar -xzf crictl.tgz -C "$RUNNER_TEMP"
          img=$RUNNER_TEMP/busybox
          mkdir -p "$img/blobs"
          reg=https://mirror.gcr.io/v2/library/busybox
          curl -fsSL -H 'Accept: application/vnd.oci.image.manifest.v1+json' -o "$img/manifest.json" \
            "$reg/manifests/sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f"
          echo "b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f  $img/manifest.json" | sha256sum -c -
          for d in $(grep -o 'sha256:[0-9a-f]\{64\}' "$img/manifest.json"); do
            curl -fsSL -o "$img/blobs/${d#sha256:}" "$reg/blobs/$d"
          done
          curl -fsSLo cni.tgz https://github.com/containernetworking/plugins/releases/download/v1.8.0/cni-plugins-linux-amd64-v1.8.0.tgz
          echo "ab3bda535f9d90766cccc90d3dddb5482003dd744d7f22bcf98186bf8eea8be6  cni.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/cni" && tar -xzf cni.tgz -C "$RUNNER_TEMP/cni"
      - run: sudo env CRICTL="$RUNNER_TEMP/crictl" IMAGE="$RUNNER_TEMP/busybox" CNI_BIN="$RUNNER_TEMP/cni" scripts/cri.sh

  cluster:
    name: a k3s node on the QuantyKube store and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: fetch k3s, CNI plugins and busybox at pinned versions
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo k3s https://github.com/k3s-io/k3s/releases/download/v1.37.1%2Bk3s1/k3s
          curl -fsSLo cni.tgz https://github.com/containernetworking/plugins/releases/download/v1.8.0/cni-plugins-linux-amd64-v1.8.0.tgz
          sha256sum -c - <<'SUMS'
          92b94582eb7b34a8cf532e6006842b9ed215a6783cf56a3dd6271fd35243b2c0  k3s
          ab3bda535f9d90766cccc90d3dddb5482003dd744d7f22bcf98186bf8eea8be6  cni.tgz
          SUMS
          chmod +x k3s
          mkdir cni && tar -xzf cni.tgz -C cni
          img=$RUNNER_TEMP/busybox
          mkdir -p "$img/blobs"
          reg=https://mirror.gcr.io/v2/library/busybox
          curl -fsSL -H 'Accept: application/vnd.oci.image.manifest.v1+json' -o "$img/manifest.json" \
            "$reg/manifests/sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f"
          echo "b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f  $img/manifest.json" | sha256sum -c -
          for d in $(grep -o 'sha256:[0-9a-f]\{64\}' "$img/manifest.json"); do
            curl -fsSL -o "$img/blobs/${d#sha256:}" "$reg/blobs/$d"
          done
      - run: cargo build --release
      - run: |
          t=$RUNNER_TEMP
          sudo env K3S=$t/k3s IMAGE=$t/busybox CNI_BIN=$t/cni scripts/cluster.sh

  kubeadm:
    name: kubeadm with the QuantyKube store as its etcd
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: fetch kubeadm, kubelet, kubectl and CNI plugins at pinned versions
        run: |
          cd "$RUNNER_TEMP"
          for b in kubeadm kubelet kubectl; do
            curl -fsSLO "https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/$b"
          done
          curl -fsSLo cni.tgz https://github.com/containernetworking/plugins/releases/download/v1.8.0/cni-plugins-linux-amd64-v1.8.0.tgz
          sha256sum -c - <<'SUMS'
          087b6340dcea496f2cde2b3888ecd414354c08a0aceabd6b7ca195cccb66ecd3  kubeadm
          cee008c1640c3b41820ef31d35b3cffc132b0c4b78c288be2b8022ebc7aa8293  kubelet
          65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8  kubectl
          ab3bda535f9d90766cccc90d3dddb5482003dd744d7f22bcf98186bf8eea8be6  cni.tgz
          SUMS
          sudo install -m 755 kubeadm kubelet kubectl /usr/local/bin/
          sudo mkdir -p /opt/cni/bin && sudo tar -xzf cni.tgz -C /opt/cni/bin
      - name: prepare the machine as kubeadm expects it
        run: |
          sudo apt-get install -y conntrack >/dev/null
          sudo swapoff -a
          sudo modprobe br_netfilter
          sudo sysctl -qw net.ipv4.ip_forward=1 net.bridge.bridge-nf-call-iptables=1
          # Docker on the runner drops forwarded packets, pods' among them
          sudo iptables -P FORWARD ACCEPT
          containerd config default | sudo tee /etc/containerd/config.toml >/dev/null
          sudo sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
          grep -q 'SystemdCgroup = true' /etc/containerd/config.toml
          sudo systemctl restart containerd
          # the unit and drop-in kubeadm's packages install
          sudo tee /etc/systemd/system/kubelet.service >/dev/null <<'UNIT'
          [Unit]
          Wants=network-online.target
          After=network-online.target
          [Service]
          ExecStart=/usr/local/bin/kubelet
          Restart=always
          StartLimitInterval=0
          RestartSec=2
          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo mkdir -p /etc/systemd/system/kubelet.service.d
          sudo tee /etc/systemd/system/kubelet.service.d/10-kubeadm.conf >/dev/null <<'UNIT'
          [Service]
          Environment="KUBELET_KUBECONFIG_ARGS=--bootstrap-kubeconfig=/etc/kubernetes/bootstrap-kubelet.conf --kubeconfig=/etc/kubernetes/kubelet.conf"
          Environment="KUBELET_CONFIG_ARGS=--config=/var/lib/kubelet/config.yaml"
          EnvironmentFile=-/var/lib/kubelet/kubeadm-flags.env
          ExecStart=
          ExecStart=/usr/local/bin/kubelet $KUBELET_KUBECONFIG_ARGS $KUBELET_CONFIG_ARGS $KUBELET_KUBEADM_ARGS
          UNIT
          sudo systemctl daemon-reload
          sudo systemctl enable kubelet
      - run: cargo build --release
      - run: sudo scripts/kubeadm.sh

  raft:
    name: Raft in the simulator, 5000 seeds per cluster size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: "cargo test --release --lib raft:: -- --nocapture"
        env:
          QUANTY_RAFT_SEEDS: "5000"
          # an index that runs past the log must fail here, not wrap
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"

  windows:
    name: kubectl-quanty for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: cargo test -p kubectl-quanty
      - run: cargo build --release -p kubectl-quanty
      - uses: actions/upload-artifact@v4
        with:
          name: kubectl-quanty-windows
          path: target/release/kubectl-quanty.exe

  msrv:
    name: test on MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo test --workspace --locked
