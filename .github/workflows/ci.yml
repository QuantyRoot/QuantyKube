name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand, so a rerun never needs a commit nobody wanted.
  workflow_dispatch:

# The toolchain is pinned, not tracked: with -D warnings every new stable
# lint would otherwise break an unrelated commit. Raising it is its own
# commit. The MSRV job is the promise, not the ceiling.
env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  msrv:
    name: test on MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo test --workspace --locked
